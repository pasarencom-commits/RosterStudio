workflows:
  roster-studio-ios:
    name: Roster Studio iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shiftlattice.rosterstudio
      vars:
        XCODE_PROJECT: RosterStudio.xcodeproj
        XCODE_SCHEME: RosterStudio
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Create an App Store Connect integration named exactly
      # "app_store_credentials" in Codemagic (Team settings > Integrations),
      # then this step uploads the build to TestFlight automatically.
      app_store_connect:
        api_key: app_store_credentials
        submit_to_testflight: true
