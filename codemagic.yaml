workflows:
  roster-studio-adhoc:
    name: Roster Studio Ad Hoc
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: app_store_credentials
    environment:
      xcode: latest
      groups:
        - code_signing
      vars:
        XCODE_PROJECT: RosterStudio.xcodeproj
        XCODE_SCHEME: RosterStudio
        BUNDLE_ID: com.shiftlattice.rosterstudio
    scripts:
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch Ad Hoc signing files from Apple
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_ADHOC --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build Ad Hoc IPA
        script: xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
