workflows:
  roster-studio-ios:
    name: Roster Studio iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shiftlattice.rosterstudio
      vars:
        XCODE_PROJECT: RosterStudio.xcodeproj
        XCODE_SCHEME: RosterStudio
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Uncomment after creating the App Store Connect integration named
    # "app_store_credentials" (Team settings > Integrations) and filling in
    # your Key ID and Issuer ID.
    # publishing:
    #   app_store_connect:
    #     api_key: app_store_credentials
    #     key_id: YOUR_KEY_ID
    #     issuer_id: YOUR_ISSUER_ID
    #     submit_to_testflight: true

  # Verifies that the Swift sources compile, without any signing material.
  # Needs no Apple account: pick this workflow when testing code changes.
  compile-check:
    name: Compile Check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: RosterStudio.xcodeproj
        XCODE_SCHEME: RosterStudio
    scripts:
      - name: Build for iOS Simulator
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
